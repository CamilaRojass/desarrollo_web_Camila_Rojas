<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/statsstyle.css') }}">
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('index') }}">
            <img id="logo-id" src="{{ url_for('static',filename='recursos/logo.png') }}" width="200" alt="Logo de Paws" style="display:inline-block">
        </a> <br>
        <h1 style="display: inline-block">Estadísticas de Adopciones</h1>
    </div>

    <div class="container">
        <!-- Gráfico 1: Líneas -->
        <div class="chart-container">
            <h3>Avisos de Adopción por Día</h3>
            <div id="chart-por-dia"></div>
        </div>

        <!-- Gráfico 2: Torta -->
        <div class="chart-container">
            <h3>Total de Avisos por Tipo de Mascota</h3>
            <div id="chart-por-tipo"></div>
        </div>

        <!-- Gráfico 3: Barras -->
        <div class="chart-container">
            <h3>Avisos Mensuales: Gatos vs Perros</h3>
            <div id="chart-por-mes"></div>
        </div>

        <div class="navigation">
            <a href="{{ url_for('index') }}" class="btn-home">Volver al inicio</a>
        </div>
    </div>

    <script src="{{ url_for('static',filename='js/stats.js') }}"></script>
</body>
</html>
