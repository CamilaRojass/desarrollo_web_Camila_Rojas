<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/addstyle.css">
    <title>Agregar aviso</title>
</head>
<body>

    <div class="container">
      <div class="logo"> 
        <a href="index.html">
        <img id="logo-id" src="/recursos/logo.png" width="200" alt="Logo de Paws">
        </a>
      </div>
      <form class="formulario" id="add-adoption-form">
        <h2>¿Donde estan las mascotas?</h2>
        <div id="donde" class="grupo-input">

            <label for="region" style="font-weight: bold;">Región</label>
            <select id="region" name="region" required>
              <option value="">Seleccione una región</option>
            </select><br>

            <label for="comuna" style="font-weight: bold;">Comuna</label>
            <select id="comuna" name="comuna" required>
              <option value="">Seleccione una comuna</option>
            </select><br>

            <label for="sector" style="font-weight: bold;">Sector</label>
            <input id="sector" name="sector" type="text" maxlength="100"> <br>

        </div>

        <h2>¿Como contactarte?</h2>
        <div id="contacto" class="grupo-input">

            <div id="nombre-input" class="grupo-input">
            <label for="nombre" style="font-weight: bold;">Nombre</label>
            <input id="nombre" name="nombre" type="text" minlength="3" maxlength="200" required>
            </div>

            <div id="email-input" class="grupo-input">
            <label for="email" style="font-weight: bold;">Email</label>
            <input type="email" id="email" maxlength="100" required>
            </div>

            <div id="numero-input" class="grupo-input">
            <label for="numero" style="font-weight: bold;">Numero de celular</label>
            <input type="tel" id="numero" name="numero" placeholder="+123.45678910" pattern="+[0-9]{3}.[0-9]{8}" >
            </div>

            <div id="contactar-input" class="grupo-input">
              <label style="font-weight: bold;">Contactar por</label>
            
                <div class="platform"><br>
                  <label for="tiktok">TikTok</label>
                    <input type="checkbox" id="tiktok" onchange="manejarCheck(this)">
                    <div class="url-box" id="tiktok-box" style="display: none;">
                        <label>Usuario o URL:</label><br>
                        <textarea placeholder="@usuario o URL" minlength="4" maxlength="50"></textarea>
                    </div>
                </div>
                
                <div class="platform"><br>
                  <label for="instagram">Instagram</label>
                    <input type="checkbox" id="instagram" onchange="manejarCheck(this)">
                    <div class="url-box" id="instagram-box" style="display: none;">
                        <label>Usuario o URL:</label><br>
                        <textarea placeholder="@usuario o URL" minlength="4" maxlength="50"></textarea>
                    </div>
                </div>
                
                <div class="platform"><br>
                  <label for="whatsapp">WhatsApp</label>
                    <input type="checkbox" id="whatsapp" onchange="manejarCheck(this)">
                    <div class="url-box" id="whatsapp-box" style="display: none;">
                        <label>Número:</label><br>
                        <textarea placeholder="+56912345678" minlength="4" maxlength="50"></textarea>
                    </div>
                </div>

                <div class="platform"><br>
                    <label for="x">X</label>
                    <input type="checkbox" id="x" onchange="manejarCheck(this)">
                    <div class="url-box" id="x-box" style="display: none;">
                        <label>Usuario:</label><br>
                        <textarea placeholder="@usuario" minlength="4" maxlength="50"></textarea>
                    </div>
                </div>
                
                <div class="platform"><br>
                  <label for="telegram">Telegram</label>
                    <input type="checkbox" id="telegram" onchange="manejarCheck(this)">
                    <div class="url-box" id="telegram-box" style="display: none;">
                        <label>Usuario:</label><br>
                        <textarea placeholder="@usuario" minlength="4" maxlength="50"></textarea>
                    </div>
                </div>
                
                <div class="platform"><br>
                  <label for="linkedin">LinkedIn</label>
                    <input type="checkbox" id="linkedin" onchange="manejarCheck(this)">
                    <div class="url-box" id="linkedin-box" style="display: none;">
                        <label>Perfil:</label><br>
                        <textarea placeholder="URL del perfil" minlength="4" maxlength="50"></textarea>
                    </div>
                </div>

            </div>
        </div>

        <h2>¿Que mascota quieres dar en adopción?</h2>
        <div id="mascota" class="grupo-input"> 
            <div id="tipo-input" class="grupo-input"> 
                <label style="font-weight: bold;">Tipo</label><br>
                
                <label for="dog">Perro</label>
                <input type="radio" id="dog" name="tipo" value="DOG"> <br>

                <label for="cat">Gato</label>
                <input type="radio" id="cat" name="tipo" value="CAT"> <br>

            </div>

            <div id="cantidad-input" class="grupo-input"> 
            <label for="cantidad" style="font-weight: bold;">Cantidad</label>
            <input id="cantidad" name="cantidad" type="number" step="1" min="1" required>
            </div>

            <div id="edad-input" class="grupo-input">
            <label for="edad" style="font-weight: bold;">Edad</label>
            <input id="edad" name="edad" type="number" step="1" min="1" required>
            </div>

            <div id="unidad-edad-input" class="grupo-input"> 
            <label style="font-weight: bold;">Unidad edad</label>
              <br>
            <input type="radio" id="month" name="unidad-edad" value="MONTH">
            <label for="month">Meses</label><br>

            <input type="radio" id="year" name="unidad-edad" value="YEAR">
            <label for="year">Años</label><br>
            </div>

            <div id="fecha-input" class="grupo-input">
            <label for="fecha" style="font-weight: bold;">Fecha disponible para entrega</label>
            <input id="fecha" name="fecha" type="datetime-local" required>
            </div>
            <div id="descripcion-input" class="grupo-input">
              <label for="descripcion" style="font-weight: bold;">Descripcion</label>
              <textarea id="descripcion" name="descripcion" cols="50" rows="10"></textarea>
            </div>
            <div id="foto-input" class="grupo-input">
            <label for="foto" style="font-weight: bold;">Foto</label>
            <input id="foto" name="foto" type="file" accept="image/*,.pdf" required>
            </div>
            
            <div id="additional-photos" class="botones2">
            <button type="button" onclick="addPhoto(this)"> Agregar otra foto
            </button>
            </div>
        </div>
    
        <div class="botones">
          <button type="button" id="envio">Agregar aviso de adopción</button>
        </div>
      </form>
    </div>

    <script src="/js/select.js"></script>
    <script src="/js/checkbox.js"></script>
    <script src="/js/validation.js"></script>
    <script src="/js/photo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
</body>
</html>
