<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="/css/statsstyle.css">
</head>
<body>
    <!-- navbar -->
    <div class="header">
        <a href="index.html">
        <img id="logo-id" src="/recursos/logo.png" width="200" alt="Logo de Paws" style="display:inline-block">
        </a>  <br>
        <h1 style="display: inline-block">Estadísticas de Adopciones</h1>
    </div>

    <div class="container">
        
        <!-- Gráfico 1: Líneas - Avisos por día -->
        <div class="chart-container">
            <h3>Avisos de Adopción por Día</h3>
            <img src="/recursos/Linea.png" alt="Linea" width="800" height="500">
        </div>

        <!-- Gráfico 2: Torta - Total por tipo de mascota -->
        <div class="chart-container">
            <h3>Total de Avisos por Tipo de Mascota</h3>
            <img src="/recursos/Torta.png" alt="Torta" width="800" height="500">
        </div>

        <!-- Gráfico 3: Barras - Avisos por mes (gatos vs perros) -->
        <div class="chart-container">
            <h3>Avisos Mensuales: Gatos vs Perros</h3>
            <img src="/recursos/Barra.png" alt="Barra" width="800" height="500">
        </div>

        <!-- Botón para volver al inicio -->
        <div class="navigation">
            <a href="index.html" class="btn-home">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
